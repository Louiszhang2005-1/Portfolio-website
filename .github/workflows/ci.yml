# Checks every push to main and every pull request before (or alongside) the Vercel deploy:
# lint, types, the same production build Vercel runs, a runtime dependency audit, and a smoke test of the built site.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# a newer push to the same branch supersedes a run still in progress
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NEXT_TELEMETRY_DISABLED: 1

jobs:
  check:
    name: Lint, types, build, audit, smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install (from the lockfile)
        run: npm ci

      # the homepage, every route, and the /game driving world
      - name: Lint
        working-directory: portfolio
        run: npx eslint src/app src/components/prototype src/components/portfolio src/components/drive src/lib src/data

      - name: Type check
        run: npx tsc --noEmit -p portfolio

      - name: Production build
        run: npm run build

      # runtime dependencies only: dev tooling never ships to visitors
      - name: Audit runtime dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Smoke test the built site
        working-directory: portfolio
        run: |
          npx next start -p 3100 > ../next.log 2>&1 &
          for i in $(seq 1 60); do curl -sf -o /dev/null http://127.0.0.1:3100/ && break; sleep 1; done

          fail=0
          expect() { # path, expected status
            code=$(curl -s -o /dev/null -w "%{http_code}" "http://127.0.0.1:3100$1")
            if [ "$code" = "$2" ]; then echo "ok   $1 -> $code"; else echo "FAIL $1 -> $code (expected $2)"; fail=1; fi
          }
          expect / 200
          expect /game 200
          expect /classic 200
          expect /portfolio/trace 200
          expect /portfolio/lunar-transport-system 200
          expect /portfolio/does-not-exist 404
          expect /media/portfolio-pages/portfolio.pdf 200

          headers=$(curl -sI http://127.0.0.1:3100/)
          for h in content-security-policy x-frame-options x-content-type-options referrer-policy permissions-policy; do
            if echo "$headers" | grep -qi "^$h:"; then echo "ok   header $h"; else echo "FAIL missing header $h"; fail=1; fi
          done
          if echo "$headers" | grep -qi "^x-powered-by:"; then echo "FAIL x-powered-by is exposed"; fail=1; fi

          if [ "$fail" = 1 ]; then echo "--- server log ---"; cat ../next.log; exit 1; fi
